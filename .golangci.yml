# golangci-lint v2 — Go lint umbrella (v0.7.26).
#
# HARD GATE since v0.10.639 (baseline triaged to zero in v0.10.634-638). The
# CI `lint` job fails on any finding; caps are lifted there
# (--max-issues-per-linter 0 --max-same-issues 0) — mirror that locally:
#   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 \
#     run --max-issues-per-linter 0 --max-same-issues 0 ./...
# Intentional patterns are excluded BELOW with a version-stamped reason
# (never silently); real findings ship as their own vX.Y.Z with a test.
#
# golangci-lint BUNDLES staticcheck (SA/ST/S/QF/U checks), so this is the only
# Go linter install — no separate staticcheck binary.
version: "2"

run:
  timeout: 5m
  # Lint test files too — the new *_test.go regression tests are first-class.
  tests: true

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused. Kept tight
  # on the first pass — high-signal core only. (misspell etc. can be added once
  # the standard-set baseline is triaged.)
  default: standard
  settings:
    staticcheck:
      # v0.10.638: QF1* = staticcheck "quickfix" stil önerileri (De Morgan, tagged
      # switch, Fprintf, ReplaceAll) — davranışsız; gözden geçirildi, kapı değil.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1*"]
    errcheck:
      # In this codebase these are idiomatically fire-and-forget: deferred
      # Close on rows/bodies, and Fprint into an http.ResponseWriter or a
      # bytes.Buffer (the write can't meaningfully fail / failure is already
      # observable downstream). Excluding them keeps errcheck's signal on what
      # matters — ignored ClickHouse / notify / store errors.
      exclude-functions:
        - (io.Closer).Close
        # v0.10.637: ClickHouse driver Rows/Conn ve redis PubSub Close'u io.Closer
        # imzasıyla eşleşmez (somut arayüz tipi); deferred Close aynı sınıf.
        - (github.com/ClickHouse/clickhouse-go/v2/lib/driver.Rows).Close
        - (github.com/ClickHouse/clickhouse-go/v2/lib/driver.Conn).Close
        - (*github.com/redis/go-redis/v9.PubSub).Close
        # v0.10.637: http.ResponseWriter'a yazım — fmt.Fprint ile aynı sınıf (istemci
        # gitmişse hata anlamsız, zaten writeJSON/writeErr yolu loglar).
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    paths:
      - frontend/node_modules # v0.10.638: yerel çalışma ağacında Go dosyası taşıyan npm paketi (flatted)
    rules:
      # v0.10.637: deferred/son-satır Close — hata alınacak yer yok, idiom kabul.
      - linters: [errcheck]
        text: 'Error return value of `[^`]*\.Close` is not checked'
      # v0.10.637: test dosyalarında errcheck gürültü (fixture yazımı, Scan, gzip).
      - linters: [errcheck]
        path: '_test\.go'

formatters:
  # gofmt drift is a real finding — surface it, but as a formatter (auto-
  # fixable via `golangci-lint fmt`) rather than a blocking linter.
  enable:
    - gofmt
