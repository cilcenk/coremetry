{{- /*
otelcol-rbac.yaml — v0.10.92, k8sattributes'ın RBAC yarısı. OPT-IN:
cluster-scoped kaynaklar (ClusterRole/Binding) chart kuralı gereği
varsayılan değerle ASLA render edilmez (aynı cluster'a iki Coremetry
kuran bankalarda çakışır); adlar release-scoped. İzinler k8sattributes
processor'ının belgelediği asgari küme: pod eşleme için pods/namespaces,
k8s.deployment.name türetimi için replicasets.
*/ -}}
{{- if and .Values.otelCollector.enabled .Values.otelCollector.k8sattributes.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coremetry.fullname" . }}-otelcol
  labels:
    {{- include "coremetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "coremetry.fullname" . }}-{{ .Release.Namespace }}-otelcol
  labels:
    {{- include "coremetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "coremetry.fullname" . }}-{{ .Release.Namespace }}-otelcol
  labels:
    {{- include "coremetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "coremetry.fullname" . }}-{{ .Release.Namespace }}-otelcol
subjects:
  - kind: ServiceAccount
    name: {{ include "coremetry.fullname" . }}-otelcol
    namespace: {{ .Release.Namespace }}
{{- end }}
